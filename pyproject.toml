## Poetry configuration
[tool.poetry]
name = "pvr_calculation"
version = "0.0.1"
description = "Segment pulsatile BFI time series and compute Pulse Variance Ratio (PVR)"
authors = ["Veronika Parfentyeva <veronika@comind.io>"]
license = "Proprietary - CoMind Techologies Limited - All rights reserved"
readme = "README.md"
repository = "https://github.com/CoMind-Technologies/pvr_calculation/"
packages = [
  { include = "pvr_calculation", from = "." }
]

# Non-Python files shipped with the package (example traces for installed wheels).
include = [
  "pvr_calculation/py.typed",
  "pvr_calculation/commit.txt",
  { path = "pvr_calculation/data/time_series_data/bfi.npy", format = ["sdist", "wheel"] },
  { path = "pvr_calculation/data/time_series_data/abp.npy", format = ["sdist", "wheel"] },
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
toml = "*"
# The below line causes poetry install to fail. Therefore, we recommend installing pymcx manually or copying the
# file: https://github.com/4D42/pymcx/blob/master/pymcx/load_mch.py directly into the project and updating paths.
#pymcx = { git = "https://github.com/4D42/pymcx/" }
matplotlib = "*"
numpy = "*"
pandas = "*"
scipy = "^1.14.1"
gitpython = "^3.1.43"
h5py = "*"
pyarrow = "*"
tqdm = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
coverage = { extras = ["toml"], version = "*" }
taskipy = "^1.10.3"
pre-commit = "^3.0.4"
ruff = "^0.0.259"


## MYPY configuration
[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"
files = "pvr_calculation"
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
exclude = ["pvr_calculation/tests"]

# Modules with known missing library stubs
[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true

## Pytest run and coverage configuration
[tool.coverage.run]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pass"]
omit = ["*/tests/*"]


[tool.ruff]
line-length=120
select = [
  "E", "F", "W", # flake8 style linter
  "I",           # isort - sort imports
##"UP",          # pyupgrade - upgrades to use modern python features
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "stubs"
]


[tool.taskipy.tasks]
# Run ruff
ruff = "poetry run ruff check ./pvr_calculation --fix"

# Run tests (add tests under pvr_calculation/tests when available)
test = "pytest -vv ."
test_coverage = "pytest -vv --cov=pvr_calculation --cov-report xml:coverage.xml ."
test_coverage_html = "pytest --cov-report html:test-cov.html --cov=pvr_calculation ."

